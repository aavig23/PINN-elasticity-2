# Physics and output defaults taken from PINN_ELASTICITY_SPEC.md.
# The physics block is locked: config loading rejects any other value.

physics:
  L: 1.0          # plate length [m]                        (spec §1.1)
  H: 0.5          # plate height [m]                        (spec §1.1)
  E: 2.0e+11      # Young's modulus [Pa]                    (spec §1.2)
  nu: 0.30        # Poisson's ratio                         (spec §1.2)
  rho: 7800.0     # density [kg/m^3]                        (spec §1.2)
  P0: 1000.0      # edge force per unit thickness [N/m]     (spec §2.5)

time:             # Stage 2 only
  T_hat: 4.0      # end of simulation window, nondimensional (spec §3.2)
  t_r_hat: 1.0    # load ramp time, nondimensional           (spec §4)

scaling:
  mode: spec_default   # spec §3.2 reference scales

output:
  nx: 101                  # export grid along x (1 cm spacing)   (spec §7.4)
  nz: 51                   # export grid along z
  n_snapshots: 8           # Stage 2 snapshots                    (spec §7.4)
  snapshot_times: null     # null -> t_hat = T_hat*k/8, k = 1..8 (decision C1)
  tip_history_points: 401  # Stage 2 tip history samples
  dpi: 150                 # figure resolution                    (spec §7.4)
