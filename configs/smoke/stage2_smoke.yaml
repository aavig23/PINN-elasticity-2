# Fast CPU smoke test for Stage 2: checks the pipeline runs end to end.
# Not a meaningful training run. Physics (T_hat, t_r_hat) stays at spec defaults.
extends: ../base/stage2_dynamic.yaml

experiment:
  id: SMOKE
  name: stage2_smoke

model:
  hidden_layers: 2
  width: 16

sampling:
  n_interior: 512
  n_top: 128
  n_bottom: 128
  n_right: 64
  n_left: 64
  n_initial: 128
  resample_every: 20

optimizer:
  adam_iterations: 40
  lbfgs_iterations: 10

training:
  log_every: 5
  lbfgs_log_every: 2
  checkpoint_every: 20

output:
  nx: 11
  nz: 6

diagnostics:
  edge_points: 21
  edge_times: 5
  precision_check_points: 128
