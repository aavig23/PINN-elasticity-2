[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-elasticity"
version = "0.1.0"
description = "PINN for 2D plane-stress elasticity of a clamped plate under axial tension (static and elastodynamic)."
readme = "README.md"
# Local development uses Python 3.13.5; Colab's Python is outside our control,
# so the code must also run on older 3.x versions (spec section 5.2).
requires-python = ">=3.10"
# Lower bounds only, never exact pins (spec section 5.2).
# On Colab, install with `pip install --no-deps -e .` so the preinstalled,
# CUDA-matched torch is never replaced.
dependencies = [
    "torch>=2.6",
    "numpy>=2.1",
    "matplotlib>=3.9",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
